openapi: 3.1.0
info:
  title: ALX API
  version: 0.1.0
  description: >-
    Auth Core with local PostgreSQL integration coverage and least-privilege repositories.
    Legacy credentials are verified inside a restricted database function and upgraded to Argon2id on first successful login when enabled.
    Real production-user credentials have not been bulk-migrated; production password changes remain disabled until client cutover and delivery configuration.
servers:
  - url: http://127.0.0.1:3001
    description: Local development only
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Process liveness probe
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: PostgreSQL and Auth readiness probe
      responses:
        '200':
          description: PostgreSQL checks and Auth use cases are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '503':
          description: Database or Auth configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: List canonical customers
      security:
        - BearerAuth: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: isActive, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          {
            description: Customers returned,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
        '401':
          {
            description: Authentication required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
        '403':
          {
            description: view_customers permission required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
  /api/v1/customers/{customerId}:
    get:
      operationId: getCustomer
      summary: Get one canonical customer
      security:
        - BearerAuth: []
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200':
          {
            description: Customer returned,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
        '404':
          {
            description: Customer not found,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
        '401':
          {
            description: Authentication required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
        '403':
          {
            description: view_customers permission required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: List orders
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        {
          '200':
            {
              description: Orders returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
          '401':
            {
              description: Authentication required,
              content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
            },
          '403':
            {
              description: view_orders required,
              content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
            },
        }
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order with items and shipments
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Order returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
          '404':
            {
              description: Order not found,
              content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
            },
        }
  /api/v1/orders/{id}/history:
    get:
      operationId: getOrderHistory
      summary: Get order audit history
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: History returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/shipments:
    get:
      operationId: listShipments
      summary: List shipments
      security: [{ BearerAuth: [] }]
      responses:
        {
          '200':
            {
              description: Shipments returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/shipments/{id}:
    get:
      operationId: getShipment
      summary: Get a shipment
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Shipment returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/shipments/{id}/tracking:
    get:
      operationId: getShipmentTracking
      summary: Get shipment tracking events from the canonical order history
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Tracking returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List products
      security: [{ BearerAuth: [] }]
      responses:
        {
          '200':
            {
              description: Products returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/products/{id}:
    get:
      operationId: getProduct
      summary: Get a product
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Product returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate with Argon2id or perform a first-login legacy upgrade
      description: When legacy authentication is enabled, a valid legacy password is upgraded to Argon2id at first successful login; PIN is never accepted as a password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Credentials accepted; returns the access and rotating refresh token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenEnvelope'
        '400':
          description: Invalid request shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Credentials invalid, user unavailable, or account locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Authentication rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Auth repository or required runtime configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Rotate a refresh token
      description: Refresh tokens are stored as hashes; reuse of a consumed token revokes its token family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Refresh token rotated; returns the new token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenEnvelope'
        '400':
          description: Invalid request shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Refresh token invalid, expired, revoked, or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Authentication rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Auth repository or required runtime configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the supplied refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Logout completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
        '400':
          description: Invalid request shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Authentication rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Auth repository or required runtime configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      summary: Return the current authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user identity, returned without secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing, invalid, expired, or revoked access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/sessions:
    get:
      operationId: getAuthSessions
      summary: List active sessions for the current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active sessions only; token values are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing, invalid, expired, or revoked access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: deleteAuthSession
      summary: Revoke an owned session
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked if it belongs to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout-all:
    post:
      operationId: postAuthLogoutAll
      summary: Revoke all active sessions for the current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All active sessions and refresh tokens revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/permissions:
    get:
      operationId: getAuthPermissions
      summary: Return effective explicit permission codes for the current user
      description: No wildcard grants are recognized; no assignments means an empty permission set.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Effective permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password:
    patch:
      operationId: patchAuthPassword
      summary: Change password after legacy-client cutover
      description: Disabled while legacy password authentication remains enabled. A successful change stores Argon2id and invalidates sessions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          description: Password changed and sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid password input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Current password invalid or user unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Legacy clients are not cut over.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      summary: Request a one-time password-reset link
      description: Requires an explicitly configured reset-delivery provider and completed legacy-client cutover. Responses do not disclose account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestInput'
      responses:
        '200':
          description: Generic response independent of account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Cutover or reset-delivery provider unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password/reset/complete:
    post:
      operationId: postAuthPasswordResetComplete
      summary: Complete a one-time password reset
      description: Reset tokens are stored hashed, expire, and can be used only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompleteInput'
      responses:
        '200':
          description: Password changed and sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Cutover requirements are not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/orders:
    post:
      operationId: createOrder
      summary: Create an order atomically with items, optional shipment, and history
      security: [{ BearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderInput' } } }
      responses:
        '200':
          {
            description: Order created or idempotent replay,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
        '400':
          {
            description: Invalid input or missing idempotency key,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
  /api/v1/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      summary: Move an order status forward and append order history
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrderStatusInput' } } }
      responses:
        '200':
          {
            description: Status updated,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
        '409':
          {
            description: Status regression rejected,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
  /api/v1/shipments/{id}:
    patch:
      operationId: updateShipment
      summary: Update shipment operational fields
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShipmentInput' } } }
      responses:
        '200':
          {
            description: Shipment updated,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
  /api/v1/products:
    post:
      operationId: createProduct
      summary: Create a catalog product
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '200':
          {
            description: Product created,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
  /api/v1/products/{id}:
    patch:
      operationId: updateProduct
      summary: Update a catalog product
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '200':
          {
            description: Product updated,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateOrderInput:
      type: object
      required: [orderNumber, items]
      properties:
        orderNumber: { type: string, minLength: 1, maxLength: 128 }
        customerId: { type: string }
        status: { type: string }
        trackingNumber: { type: string }
        items: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/OrderItemInput' } }
        shipment: { $ref: '#/components/schemas/ShipmentInput' }
    OrderItemInput:
      type: object
      required: [quantity, unitPrice]
      properties:
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        weight: { type: number, minimum: 0 }
        cbm: { type: number, minimum: 0 }
    ShipmentInput:
      type: object
      properties:
        trackingNumber: { type: string }
        shippingCompanyId: { type: string }
        courierId: { type: string }
        shipmentStatus: { type: string }
        shippingCost: { type: number, minimum: 0 }
        weight: { type: number, minimum: 0 }
        cartonCount: { type: integer, minimum: 0 }
    UpdateOrderStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1, maxLength: 80 }
        note: { type: string, maxLength: 500 }
    ProductInput:
      type: object
      required: [productId]
      properties:
        productId: { type: string, minLength: 1, maxLength: 128 }
        productNameAr: { type: string }
        productNameEn: { type: string }
        productUrl: { type: string, format: uri }
        unitPrice: { type: number, minimum: 0 }
        itemCategoryId: { type: string }
        weight: { type: number, minimum: 0 }
    LoginInput:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
    RefreshInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 32, maxLength: 512 }
    AuthTokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresInSeconds]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresInSeconds: { type: integer, minimum: 1 }
    LogoutResult:
      type: object
      additionalProperties: false
      required: [loggedOut]
      properties:
        loggedOut: { type: boolean, const: true }
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 1024, format: password }
        newPassword: { type: string, minLength: 12, maxLength: 128, format: password }
    PasswordResetRequestInput:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
    PasswordResetCompleteInput:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 32, maxLength: 256, format: password }
        newPassword: { type: string, minLength: 12, maxLength: 128, format: password }
    SuccessEnvelope:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: { type: object }
        meta:
          type: object
          additionalProperties: true
        requestId: { type: string }
    AuthTokenEnvelope:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AuthTokenPair' }
        meta:
          type: object
          additionalProperties: true
        requestId: { type: string }
    LogoutEnvelope:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/LogoutResult' }
        meta:
          type: object
          additionalProperties: true
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  field: { type: string }
                  message: { type: string }
            requestId: { type: string }
