openapi: 3.1.0
info:
  title: ALX API
  version: 0.1.0
  description: >-
    Auth Core with local PostgreSQL integration coverage and least-privilege repositories.
    Legacy credentials are verified inside a restricted database function and upgraded to Argon2id on first successful login when enabled.
    Real production-user credentials have not been bulk-migrated; production password changes remain disabled until client cutover and delivery configuration.
servers:
  - url: http://127.0.0.1:3001
    description: Local development only
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Process liveness probe
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: PostgreSQL and Auth readiness probe
      responses:
        '200':
          description: PostgreSQL checks and Auth use cases are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '503':
          description: Database or Auth configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: List canonical customers
      security:
        - BearerAuth: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: isActive, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          {
            description: Customers returned,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
        '401':
          {
            description: Authentication required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
        '403':
          {
            description: view_customers permission required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
  /api/v1/customers/{customerId}:
    get:
      operationId: getCustomer
      summary: Get one canonical customer
      security:
        - BearerAuth: []
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200':
          {
            description: Customer returned,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
        '404':
          {
            description: Customer not found,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
        '401':
          {
            description: Authentication required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
        '403':
          {
            description: view_customers permission required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: List orders
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        {
          '200':
            {
              description: Orders returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
          '401':
            {
              description: Authentication required,
              content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
            },
          '403':
            {
              description: view_orders required,
              content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
            },
        }
    post:
      operationId: createOrder
      summary: Create an order atomically with items, optional shipment, and history
      security: [{ BearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderInput' } } }
      responses:
        '200': { description: Order created or idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { description: Invalid input or missing idempotency key, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order with items and shipments
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Order returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
          '404':
            {
              description: Order not found,
              content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
            },
        }
  /api/v1/orders/{id}/history:
    get:
      operationId: getOrderHistory
      summary: Get order audit history
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: History returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/shipments:
    get:
      operationId: listShipments
      summary: List shipments
      security: [{ BearerAuth: [] }]
      responses:
        {
          '200':
            {
              description: Shipments returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/shipments/{id}:
    get:
      operationId: getShipment
      summary: Get a shipment
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Shipment returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
    patch:
      operationId: updateShipment
      summary: Update shipment operational fields
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShipmentInput' } } }
      responses:
        '200': { description: Shipment updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /api/v1/shipments/{id}/tracking:
    get:
      operationId: getShipmentTracking
      summary: Get shipment tracking events from the canonical order history
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Tracking returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List products
      security: [{ BearerAuth: [] }]
      responses:
        {
          '200':
            {
              description: Products returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
    post:
      operationId: createProduct
      summary: Create a catalog product
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '200': { description: Product created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /api/v1/products/{id}:
    get:
      operationId: getProduct
      summary: Get a product
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Product returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
    patch:
      operationId: updateProduct
      summary: Update a catalog product
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '200': { description: Product updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /api/v1/portal/auth/register:
    post:
      operationId: postPortalAuthRegister
      summary: Register a Portal user with an Argon2id credential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalRegisterInput' }
      responses:
        '200': { description: Portal account created, content: { application/json: { schema: { $ref: '#/components/schemas/PortalRegistrationEnvelope' } } } }
        '400': { description: Invalid registration input, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: Account already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /api/v1/portal/auth/login:
    post:
      operationId: postPortalAuthLogin
      summary: Authenticate an approved Portal user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalLoginInput' }
      responses:
        '200': { description: Credentials accepted, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenEnvelope' } } } }
        '400': { description: Invalid login input, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Credentials are invalid, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Portal account is pending approval, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /api/v1/portal/auth/refresh:
    post:
      operationId: postPortalAuthRefresh
      summary: Rotate a Portal refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshInput' }
      responses:
        '200': { description: Rotated token pair, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenEnvelope' } } } }
        '400': { description: Invalid refresh request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Refresh token is invalid, expired, revoked, or reused, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /api/v1/portal/auth/logout:
    post:
      operationId: postPortalAuthLogout
      summary: Revoke the Portal refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshInput' }
      responses:
        '200': { description: Refresh token and its session revoked, content: { application/json: { schema: { $ref: '#/components/schemas/LogoutEnvelope' } } } }
        '400': { description: Invalid logout request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /api/v1/portal/auth/me:
    get:
      operationId: getPortalAuthProfile
      summary: Get the authenticated Portal profile
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Portal profile returned, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /api/v1/portal/auth/profile:
    patch:
      operationId: patchPortalAuthProfile
      summary: Update the authenticated Portal profile
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalProfileUpdateInput' }
      responses:
        '200': { description: Updated Portal profile, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: Email already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /api/v1/portal/auth/password:
    patch:
      operationId: patchPortalAuthPassword
      summary: Change the authenticated Portal user's password
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalChangePasswordInput' }
      responses:
        '200': { description: Password changed, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { description: Invalid password input, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Authentication required or current password is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate with Argon2id or perform a first-login legacy upgrade
      description: When legacy authentication is enabled, a valid legacy password is upgraded to Argon2id at first successful login; PIN is never accepted as a password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Credentials accepted; returns the access and rotating refresh token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenEnvelope'
        '400':
          description: Invalid request shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Credentials invalid, user unavailable, or account locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Authentication rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Auth repository or required runtime configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Rotate a refresh token
      description: Refresh tokens are stored as hashes; reuse of a consumed token revokes its token family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Refresh token rotated; returns the new token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenEnvelope'
        '400':
          description: Invalid request shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Refresh token invalid, expired, revoked, or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Authentication rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Auth repository or required runtime configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the supplied refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Logout completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
        '400':
          description: Invalid request shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Authentication rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Auth repository or required runtime configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      summary: Return the current authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user identity, returned without secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing, invalid, expired, or revoked access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/sessions:
    get:
      operationId: getAuthSessions
      summary: List active sessions for the current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active sessions only; token values are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing, invalid, expired, or revoked access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: deleteAuthSession
      summary: Revoke an owned session
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked if it belongs to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout-all:
    post:
      operationId: postAuthLogoutAll
      summary: Revoke all active sessions for the current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All active sessions and refresh tokens revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/permissions:
    get:
      operationId: getAuthPermissions
      summary: Return effective explicit permission codes for the current user
      description: No wildcard grants are recognized; no assignments means an empty permission set.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Effective permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password:
    patch:
      operationId: patchAuthPassword
      summary: Change password after legacy-client cutover
      description: Disabled while legacy password authentication remains enabled. A successful change stores Argon2id and invalidates sessions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          description: Password changed and sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid password input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Current password invalid or user unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Legacy clients are not cut over.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      summary: Request a one-time password-reset link
      description: Requires an explicitly configured reset-delivery provider and completed legacy-client cutover. Responses do not disclose account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestInput'
      responses:
        '200':
          description: Generic response independent of account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Cutover or reset-delivery provider unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password/reset/complete:
    post:
      operationId: postAuthPasswordResetComplete
      summary: Complete a one-time password reset
      description: Reset tokens are stored hashed, expire, and can be used only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompleteInput'
      responses:
        '200':
          description: Password changed and sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Cutover requirements are not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      summary: Move an order status forward and append order history
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrderStatusInput' } } }
      responses:
        '200':
          {
            description: Status updated,
            content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
          }
        '409':
          {
            description: Status regression rejected,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
  /api/v1/finance/accounts:
    get:
      operationId: listFinancialAccounts
      summary: List active financial accounts
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        {
          '200':
            {
              description: Accounts returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/finance/accounts/{id}/movements:
    get:
      operationId: listAccountMovements
      summary: List posted account movements
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Movements returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/finance/entry-modules:
    get:
      operationId: listEntryModules
      summary: List active financial entry modules
      security: [{ BearerAuth: [] }]
      responses:
        {
          '200':
            {
              description: Entry modules returned,
              content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
            },
        }
  /api/v1/finance/entry-types:
    get:
      operationId: listEntryTypes
      summary: List active financial entry types
      security: [{ BearerAuth: [] }]
