openapi: 3.1.0
info:
  title: ALX API
  version: 0.1.0
  description: Initial API foundation with versioned Auth contracts and testable use-case logic. Production Auth remains unavailable until a secured PostgreSQL repository and credential migration are approved.
servers:
  - url: http://127.0.0.1:3001
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Process liveness probe
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Database and Auth readiness probe
      responses:
        '200':
          description: PostgreSQL is reachable and Auth use cases are wired.
        '503':
          description: Service remains not-ready until PostgreSQL is reachable and Auth use cases are wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate a user (use case not yet configured)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Credentials accepted; returns the token pair.
        '400':
          description: Invalid request shape.
        '429':
          description: Authentication rate limit exceeded.
        '503':
          description: Auth repository and use cases are not yet configured.
  /api/v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Rotate a refresh token (use case not yet configured)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200': { description: Rotated token pair. }
        '400': { description: Invalid request shape. }
        '429': { description: Authentication rate limit exceeded. }
        '503': { description: Auth repository and use cases are not yet configured. }
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke a refresh token (use case not yet configured)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200': { description: Refresh token revoked. }
        '400': { description: Invalid request shape. }
        '429': { description: Authentication rate limit exceeded. }
        '503': { description: Auth repository and use cases are not yet configured. }
components:
  schemas:
    LoginInput:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
    RefreshInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 32, maxLength: 512 }
    SuccessEnvelope:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: { type: object }
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array }
            requestId: { type: string }
