openapi: 3.1.0
info:
  title: ALX API
  version: 0.1.0
  description: Initial infrastructure scaffold. Business routes and authentication are not enabled.
servers:
  - url: http://127.0.0.1:3001
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Process liveness probe
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Dependency readiness probe
      responses:
        '200':
          description: Dependencies are ready.
        '503':
          description: Service is intentionally not ready until PostgreSQL and deployment configuration are added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: { type: object }
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array }
            requestId: { type: string }
