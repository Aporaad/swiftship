components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FinancialEntryInput:
      type: object
      required: [entryNumber, moduleId, entryTypeId, entryCategory, description, lines]
      properties:
        entryNumber: { type: string, minLength: 1, maxLength: 100 }
        moduleId: { type: string }
        entryTypeId: { type: string }
        entryCategory: { type: string, enum: [General, Compound, Temp, Reversing] }
        postingStatus: { type: string, enum: [draft, posted], default: draft }
        description: { type: string, minLength: 1 }
        lines: { type: array, minItems: 2, items: { $ref: '#/components/schemas/FinancialEntryLine' } }
    FinancialEntryLine:
      type: object
      required: [accountId, accountCurNo, transType, amount, amountOriginal, currencyOriginalNo]
      properties:
        accountId: { type: string }
        accountCurNo: { type: integer, minimum: 1 }
        transType: { type: string, enum: [Debit, Credit] }
        amount: { type: number, exclusiveMinimum: 0 }
        amountOriginal: { type: number, exclusiveMinimum: 0 }
        currencyOriginalNo: { type: integer, minimum: 1 }
    ReversalInput:
      type: object
      required: [description]
      properties: { description: { type: string, minLength: 1 }, effectiveAt: { type: string, format: date-time } }
    AutoEntryRuleInput:
      type: object
      required:
        [
          nameAr,
          nameEn,
          amountSource,
          amountSources,
          debitAccount,
          creditAccount,
          descriptionTemplateAr,
          descriptionTemplateEn,
        ]
      properties:
        nameAr: { type: string }
        nameEn: { type: string }
        amountSource: { type: string }
        amountSources: { type: array, minItems: 1, items: { type: string } }
        debitAccount: { type: string }
        creditAccount: { type: string }
        autoPost: { type: boolean, default: true }
        skipWhenZero: { type: boolean, default: true }
        descriptionTemplateAr: { type: string }
        descriptionTemplateEn: { type: string }
    CreateOrderInput:
      type: object
      required: [orderNumber, items]
      properties:
        orderNumber: { type: string, minLength: 1, maxLength: 128 }
        customerId: { type: string }
        status: { type: string }
        trackingNumber: { type: string }
        items: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/OrderItemInput' } }
        shipment: { $ref: '#/components/schemas/ShipmentInput' }
    OrderItemInput:
      type: object
      required: [quantity, unitPrice]
      properties:
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        weight: { type: number, minimum: 0 }
        cbm: { type: number, minimum: 0 }
    ShipmentInput:
      type: object
      properties:
        trackingNumber: { type: string }
        shippingCompanyId: { type: string }
        courierId: { type: string }
        shipmentStatus: { type: string }
        shippingCost: { type: number, minimum: 0 }
        weight: { type: number, minimum: 0 }
        cartonCount: { type: integer, minimum: 0 }
    UpdateOrderStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1, maxLength: 80 }
        note: { type: string, maxLength: 500 }
    ProductInput:
      type: object
      required: [productId]
      properties:
        productId: { type: string, minLength: 1, maxLength: 128 }
        productNameAr: { type: string }
        productNameEn: { type: string }
        productUrl: { type: string, format: uri }
        unitPrice: { type: number, minimum: 0 }
        itemCategoryId: { type: string }
        weight: { type: number, minimum: 0 }
    PortalRegisterInput:
      type: object
      required: [fullName, phone, email, password, portalRole]
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, minLength: 3, maxLength: 40 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        portalRole: { type: string, enum: [customer, courier, supplier] }
        username: { type: string, minLength: 3, maxLength: 80 }
    PortalAuthProfile:
      type: object
      additionalProperties: false
      required: [portalUserId, username, email, fullName, phone, role, approvalStatus, onboardingCompleted]
      properties:
        portalUserId: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string }
        role: { type: string, enum: [customer, courier, supplier] }
        approvalStatus: { type: string, enum: [approved, pending_approval, rejected] }
        onboardingCompleted: { type: boolean }
    PortalRegistrationResult:
      type: object
      additionalProperties: false
      required: [profile, pendingApproval, tokens]
      properties:
        profile: { $ref: '#/components/schemas/PortalAuthProfile' }
        pendingApproval: { type: boolean }
        tokens:
          oneOf:
            - { $ref: '#/components/schemas/AuthTokenPair' }
            - { type: 'null' }
    PortalRegistrationEnvelope:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/PortalRegistrationResult' }
        meta: { type: object, additionalProperties: true }
        requestId: { type: string }
    PortalProfileUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, minLength: 3, maxLength: 40 }
        email: { type: string, format: email, maxLength: 254 }
    PortalLoginInput:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, format: password }
    PortalChangePasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, format: password }
        newPassword: { type: string, minLength: 12, maxLength: 128, format: password }
    LoginInput:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
    RefreshInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 32, maxLength: 512 }
    AuthTokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresInSeconds]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresInSeconds: { type: integer, minimum: 1 }
    LogoutResult:
      type: object
      additionalProperties: false
      required: [loggedOut]
      properties:
        loggedOut: { type: boolean, const: true }
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 1024, format: password }
        newPassword: { type: string, minLength: 12, maxLength: 128, format: password }
    PasswordResetRequestInput:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
    PasswordResetCompleteInput:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 32, maxLength: 256, format: password }
        newPassword: { type: string, minLength: 12, maxLength: 128, format: password }
    SuccessEnvelope:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: { type: object }
        meta:
          type: object
          additionalProperties: true
        requestId: { type: string }
    AuthTokenEnvelope:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AuthTokenPair' }
        meta:
          type: object
          additionalProperties: true
        requestId: { type: string }
    LogoutEnvelope:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/LogoutResult' }
        meta:
          type: object
          additionalProperties: true
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  field: { type: string }
                  message: { type: string }
            requestId: { type: string }
