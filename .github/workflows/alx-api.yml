name: ALX API CI

on:
  push:
    paths:
      - "alx_api/**"
      - ".github/workflows/alx-api.yml"
  pull_request:
    paths:
      - "alx_api/**"
      - ".github/workflows/alx-api.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alx_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alx_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: alx_api
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-test-only-password@localhost:5432/alx_api_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alx_api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npx prettier --check ../.github/workflows/alx-api.yml
      - run: npm test
      - run: npm run test:db
      - run: npm run build
