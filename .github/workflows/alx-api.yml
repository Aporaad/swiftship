name: ALX API CI

on:
  push:
    paths:
      - 'alx_api/**'
      - '.github/workflows/alx-api.yml'
  pull_request:
    paths:
      - 'alx_api/**'
      - '.github/workflows/alx-api.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alx_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alx_api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
